<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La paradoja de Pi = 4</title>
<style>
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background-color: #0f172a;
    color: #f8fafc;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  header { text-align: center; padding: 2rem 1rem 1rem; }
  h1 { margin: 0 0 0.5rem; color: #3b82f6; }
  p.sub { margin: 0; color: #94a3b8; max-width: 600px; }
  
  .container {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    justify-content: center;
    padding: 1rem;
    max-width: 800px;
    align-items: center;
  }

  .canvas-container {
    background: #1e293b;
    padding: 1rem;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  canvas { display: block; background: #fff; border-radius: 4px; }

  .controls {
    background: #1e293b;
    padding: 1.5rem;
    border-radius: 12px;
    width: 100%;
    max-width: 350px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  
  /* ARREGLO: Aseguramos que el slider tenga espacio y la etiqueta un ancho fijo */
  input[type=range] { flex: 1; cursor: pointer; min-width: 0; }
  #stepsLabel { min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
  
  .stats {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    margin-top: 1rem;
  }
  .stat {
    background: #0f172a;
    padding: 1rem;
    border-radius: 8px;
    border: 1px solid #334155;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stat span { color: #94a3b8; font-size: 0.9rem; }
  .stat strong { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .stat.sq strong { color: #3b82f6; }
  .stat.circ strong { color: #ef4444; }
</style>
</head>
<body>

<header>
  <h1>La paradoja de &pi; = 4</h1>
  <p class="sub">Empieza con un cuadrado rodeando el círculo. Corta las esquinas infinitamente. El perímetro siempre será 4.</p>
</header>

<div class="container">
  <div class="canvas-container">
    <canvas id="c" width="350" height="350"></canvas>
  </div>
  
  <div class="controls">
    <div class="row">
      <label for="steps">Cortes:</label>
      <input type="range" id="steps" min="0" max="7" value="0" step="1">
      <strong id="stepsLabel">1</strong>
    </div>

    <div class="stats">
      <div class="stat sq">
        <span>Perímetro cuadrado/escalera:</span>
        <strong id="lengthLabel">4.0000</strong>
      </div>
      <div class="stat circ">
        <span>Longitud del círculo (&pi;):</span>
        <strong>3.1415</strong>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('steps');
  const stepsLabel = document.getElementById('stepsLabel');

  const CX = canvas.width / 2;
  const CY = canvas.height / 2;
  const R = 120;

  function draw() {
    const level = parseInt(slider.value, 10);
    const N = Math.pow(2, level); 
    
    // ARREGLO: Solo mostramos el número para que no colapse el diseño
    stepsLabel.textContent = N; 

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Círculo de referencia (rojo)
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.stroke();

    // 2. Escalera/Cuadrado (azul)
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = Math.max(1, 4 - level * 0.5);
    ctx.lineJoin = 'miter';

    ctx.beginPath();
    ctx.moveTo(CX + R, CY);

    // Q1
    for (let i = 0; i < N; i++) {
      let a1 = i * (Math.PI / (2 * N));
      let a2 = (i + 1) * (Math.PI / (2 * N));
      let x1 = CX + R * Math.cos(a1);
      let y2 = CY - R * Math.sin(a2);
      let x2 = CX + R * Math.cos(a2);
      ctx.lineTo(x1, y2);
      ctx.lineTo(x2, y2);
    }

    // Q2
    for (let i = 0; i < N; i++) {
      let a1 = Math.PI/2 + i * (Math.PI / (2 * N));
      let a2 = Math.PI/2 + (i + 1) * (Math.PI / (2 * N));
      let x2 = CX + R * Math.cos(a2);
      let y1 = CY - R * Math.sin(a1);
      let y2 = CY - R * Math.sin(a2);
      ctx.lineTo(x2, y1);
      ctx.lineTo(x2, y2);
    }

    // Q3
    for (let i = 0; i < N; i++) {
      let a1 = Math.PI + i * (Math.PI / (2 * N));
      let a2 = Math.PI + (i + 1) * (Math.PI / (2 * N));
      let x1 = CX + R * Math.cos(a1);
      let y2 = CY - R * Math.sin(a2);
      let x2 = CX + R * Math.cos(a2);
      ctx.lineTo(x1, y2);
      ctx.lineTo(x2, y2);
    }

    // Q4
    for (let i = 0; i < N; i++) {
      let a1 = 1.5 * Math.PI + i * (Math.PI / (2 * N));
      let a2 = 1.5 * Math.PI + (i + 1) * (Math.PI / (2 * N));
      let x2 = CX + R * Math.cos(a2);
      let y1 = CY - R * Math.sin(a1);
      let y2 = CY - R * Math.sin(a2);
      ctx.lineTo(x2, y1);
      ctx.lineTo(x2, y2);
    }

    ctx.stroke();
  }

  slider.addEventListener('input', draw);
  draw();
</script>
</body>
</html>
